<html lang="pt-BR">

<title>Simulador de Prova Prática - Anatomia</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body { 
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 20px;
    }
    
    .container {
        max-width: 900px;
        margin: 0 auto;
        background: white;
        border-radius: 20px;
        padding: 30px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    
    h1 {
        text-align: center;
        color: #2d3748;
        margin-bottom: 30px;
        font-size: 2em;
    }
    
    .menu-inicial {
        display: flex;
        gap: 20px;
        justify-content: center;
        margin-bottom: 30px;
    }
    
    button {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        padding: 15px 30px;
        border-radius: 10px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s;
    }
    
    button:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    }
    
    button:active {
        transform: translateY(0);
    }
    
    .info-panel {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
        padding: 15px;
        background: #f7fafc;
        border-radius: 10px;
    }
    
    #timer {
        font-size: 32px;
        font-weight: bold;
        color: #e53e3e;
    }
    
    #questao-numero {
        font-size: 18px;
        color: #4a5568;
        font-weight: bold;
    }
    
    .imagem-container {
        text-align: center;
        margin: 30px 0;
        padding: 20px;
        background: #f7fafc;
        border-radius: 10px;
    }
    
    img {
        max-width: 100%;
        height: auto;
        max-height: 400px;
        border-radius: 10px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    
    textarea {
        width: 100%;
        min-height: 120px;
        padding: 15px;
        border: 2px solid #e2e8f0;
        border-radius: 10px;
        font-size: 16px;
        font-family: inherit;
        resize: vertical;
        margin: 15px 0;
    }
    
    textarea:focus {
        outline: none;
        border-color: #667eea;
    }
    
    .multipla-opcoes {
        display: flex;
        flex-direction: column;
        gap: 15px;
        margin: 20px 0;
    }
    
    .multipla-opcoes button {
        background: white;
        color: #2d3748;
        border: 2px solid #e2e8f0;
        text-align: left;
        padding: 15px 20px;
        font-weight: normal;
    }
    
    .multipla-opcoes button:hover {
        border-color: #667eea;
        background: #f7fafc;
    }
    
    #feedback {
        margin-top: 20px;
        padding: 20px;
        border-radius: 10px;
        font-size: 18px;
        font-weight: bold;
        text-align: center;
    }
    
    .feedback-correto {
        background: #c6f6d5;
        color: #22543d;
    }
    
    .feedback-errado {
        background: #fed7d7;
        color: #742a2a;
    }
    
    .hidden { display: none; }
    
    .btn-acao {
        background: #48bb78;
        margin-top: 15px;
    }
    
    .btn-acao:hover {
        background: #38a169;
    }
    
    .btn-proxima {
        background: #4299e1;
    }
    
    .btn-proxima:hover {
        background: #3182ce;
    }
    
    .instrucao {
        font-size: 18px;
        color: #4a5568;
        margin-bottom: 15px;
        font-weight: 500;
    }
</style>
</head>

<div class="container">

    <div id="menu-inicial" class="menu-inicial">

onerror="this.style.opacity='0.2'">
        </div>

            <p class="instrucao">Descreva a estrutura anatômica apresentada:</p>
            <textarea id="resposta" placeholder="Digite sua resposta aqui..."></textarea><br>
            <button class="btn-acao" onclick="corrigirDiscursiva()">Corrigir</button>
        </div>

        <div id="multipla" class="hidden">
            <p class="instrucao">Identifique a estrutura anatômica:</p>

        </div>

        <div id="feedback"></div>

</div>

let modoAtual = '';
let questaoAtual = 0;
let tempo = 40;
let timer;
let acertos = 0;

function iniciarProva(modo) {
    modoAtual = modo;
    questaoAtual = 0;
    acertos = 0;
    
    document.getElementById('menu-inicial').classList.add('hidden');
    document.getElementById('prova-container').classList.remove('hidden');
    
    if (modo === 'discursiva') {
        document.getElementById('discursiva').classList.remove('hidden');
        document.getElementById('multipla').classList.add('hidden');
    } else {
        document.getElementById('multipla').classList.remove('hidden');
        document.getElementById('discursiva').classList.add('hidden');
    }
    
    carregarQuestao();
}

function carregarQuestao() {
    if (questaoAtual >= questoes.length) {
        finalizarProva();
        return;
    }
    
    const questao = questoes[questaoAtual];
    
    document.getElementById('questao-numero').innerText = `Questão ${questaoAtual + 1}/${questoes.length}`;
    const canvas = document.getElementById('canvas-img');
const ctx = canvas.getContext('2d');

// Clear canvas
ctx.clearRect(0, 0, canvas.width, canvas.height);

const imgEl = new Image();
imgEl.onload = function() {
    // Size canvas to fit container (max 340px tall)
    const maxH = 340, maxW = canvas.parentElement.clientWidth || 400;
    const scale = Math.min(maxW / imgEl.width, maxH / imgEl.height);
    canvas.width  = imgEl.width  * scale;
    canvas.height = imgEl.height * scale;

    ctx.drawImage(imgEl, 0, 0, canvas.width, canvas.height);

    // Draw arrow if seta defined
    if (questao.seta) {
        const tx = questao.seta.x * canvas.width;
        const ty = questao.seta.y * canvas.height;
        // Arrow comes from offset
        const dx = tx > canvas.width * 0.5 ? -60 : 60;
        const dy = ty > canvas.height * 0.5 ? -50 : 50;
        const sx = tx + dx;
        const sy = ty + dy;

        ctx.save();
        ctx.strokeStyle = '#ff2222';
        ctx.fillStyle   = '#ff2222';
        ctx.lineWidth   = Math.max(3, canvas.width * 0.012);
        ctx.lineCap     = 'round';

        // Line
        ctx.beginPath();
        ctx.moveTo(sx, sy);
        ctx.lineTo(tx, ty);
        ctx.stroke();

        // Arrowhead
        const angle = Math.atan2(ty - sy, tx - sx);
        const headLen = Math.max(14, canvas.width * 0.045);
        ctx.beginPath();
        ctx.moveTo(tx, ty);
        ctx.lineTo(tx - headLen * Math.cos(angle - 0.4), ty - headLen * Math.sin(angle - 0.4));
        ctx.lineTo(tx - headLen * Math.cos(angle + 0.4), ty - headLen * Math.sin(angle + 0.4));
        ctx.closePath();
        ctx.fill();

        // Circle highlight at tip
        ctx.beginPath();
        ctx.arc(tx, ty, Math.max(6, canvas.width * 0.018), 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,34,34,0.35)';
        ctx.fill();

        ctx.restore();
    }
};
imgEl.src = questao.imagem;
    document.getElementById('feedback').innerHTML = '';
    document.getElementById('feedback').className = '';
    document.getElementById('btn-proxima').classList.add('hidden');
    
    if (modoAtual === 'discursiva') {
        document.getElementById('resposta').value = '';
    } else {
        const opcoesContainer = document.getElementById('opcoes-container');
        opcoesContainer.innerHTML = '';
        questao.alternativas.forEach((alt, index) => {
            const btn = document.createElement('button');
            btn.innerText = alt;
            btn.onclick = () => responderMultipla(index);
            opcoesContainer.appendChild(btn);
        });
    }
    
    iniciarTimer();
}

function iniciarTimer() {
    clearInterval(timer);
    tempo = 40;
    document.getElementById('timer').innerText = tempo;
    
    timer = setInterval(() => {
        tempo--;
        document.getElementById('timer').innerText = tempo;
        
        if (tempo <= 10) {
            document.getElementById('timer').style.color = '#e53e3e';
        }
        
        if (tempo <= 0) {
            clearInterval(timer);
            if (modoAtual === 'discursiva') {
                corrigirDiscursiva();
            } else {
                mostrarFeedback(false, `⏱️ Tempo esgotado!<br><br>Resposta correta: ${questoes[questaoAtual].alternativas[questoes[questaoAtual].correta]}`);
            }
        }
    }, 1000);
}

function corrigirDiscursiva() {
    clearInterval(timer);
    
    const questao = questoes[questaoAtual];
    const resposta = document.getElementById('resposta').value.toLowerCase();
    
    let pontos = 0;
    questao.palavrasChave.forEach((palavra, index) => {
        if (resposta.includes(palavra.toLowerCase())) {
            pontos += questao.pontosPalavra[index];
        }
    });
    
    const notaFinal = Math.min(pontos, 10);
    const passou = notaFinal >= 6;
    
    if (passou) acertos++;
    
    const feedback = `
        <strong>Nota: ${notaFinal}/10</strong><br><br>
        Gabarito: ${questao.resposta}<br><br>
        ${passou ? '✅ Aprovado!' : '❌ Revise este conteúdo!'}
    `;
    
    mostrarFeedback(passou, feedback);
}

function responderMultipla(opcaoEscolhida) {
    clearInterval(timer);
    
    const questao = questoes[questaoAtual];
    const correto = opcaoEscolhida === questao.correta;
    
    if (correto) acertos++;
    
    const feedback = correto 
        ? `✅ <strong>Correto!</strong><br><br>${questao.resposta}`
        : `❌ <strong>Incorreto!</strong><br><br>Resposta correta: ${questao.alternativas[questao.correta]}<br>${questao.resposta}`;
    
    mostrarFeedback(correto, feedback);
}

function mostrarFeedback(correto, mensagem) {
    const feedbackDiv = document.getElementById('feedback');
    feedbackDiv.innerHTML = mensagem;
    feedbackDiv.className = correto ? 'feedback-correto' : 'feedback-errado';
    document.getElementById('btn-proxima').classList.remove('hidden');
}

function proximaQuestao() {
    questaoAtual++;
    carregarQuestao();
}

function finalizarProva() {
    clearInterval(timer);
    
    const porcentagem = (acertos / questoes.length * 100).toFixed(1);
    const passou = porcentagem >= 60;
    
    document.getElementById('prova-container').innerHTML = `
        <div style="text-align: center; padding: 40px;">
            <h2 style="font-size: 2.5em; margin-bottom: 20px;">
                ${passou ? '🎉' : '📚'} Prova Finalizada!
            </h2>
            <div style="font-size: 4em; font-weight: bold; color: ${passou ? '#38a169' : '#e53e3e'}; margin: 30px 0;">
                ${acertos}/${questoes.length}
            </div>
            <div style="font-size: 1.8em; margin-bottom: 30px;">
                ${porcentagem}% de aproveitamento
            </div>
            <div style="font-size: 1.2em; color: #4a5568; margin-bottom: 40px;">
                ${passou ? '✅ Aprovado! Parabéns!' : '❌ Continue estudando!'}
            </div>
            <button onclick="location.reload()" style="font-size: 18px;">
                🔄 Nova Prova
            </button>
        </div>
    `;
}
